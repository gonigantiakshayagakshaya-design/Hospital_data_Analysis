<!DOCTYPE html>
<html>
<head>
    <title>Update Patient</title>
</head>
<body>

    <h1>Update Patient Details</h1>

    <form method="GET" action="/update_patient">
        <label>Enter Patient ID:</label>
        <input type="number" name="patient_id" required>
        <button type="submit">Search Patient</button>
    </form>

    {% if patient %}

    <h2>Patient Details</h2>

    <form method="POST" action="/update_patient">

        <input type="hidden" name="patient_id"
               value="{{ patient.patient_id }}">

        <label>Name:</label>
        <input type="text" name="name"
               value="{{ patient.name }}" required>
        <br><br>

        <label>Age:</label>
        <input type="number" name="age"
               value="{{ patient.age }}" required>
        <br><br>

        <label>Gender:</label>
        <input type="text" name="gender"
               value="{{ patient.gender or '' }}">
        <br><br>

        <label>Disease:</label>
        <input type="text" name="disease"
               value="{{ patient.disease or '' }}">
        <br><br>

        <label>Department:</label>
        <input type="text" name="department"
               value="{{ patient.department or '' }}">
        <br><br>
<br><br>

<label>Bill Amount:</label>
<input type="number"
       name="bill"
       value="{{ patient.bill or 0 }}"
       step="0.01"
       min="0"
       required>
<br><br>
        <button type="submit">Update Patient</button>

    </form>

    {% endif %}

    <br>
    <a href="/">Back to Dashboard</a>

</body>
</html>
